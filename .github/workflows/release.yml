# Push a version tag (e.g. v0.5.0) to build the extension zip with
# scripts/build.sh and publish it as a GitHub release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release and upload the zip

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches manifest version
        run: |
          manifest_version=$(python3 -c 'import json; print(json.load(open("manifest.json"))["version"])')
          if [ "${GITHUB_REF_NAME#v}" != "$manifest_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match manifest.json version $manifest_version"
            exit 1
          fi

      - name: Build zip
        id: build
        run: echo "zip=$(./scripts/build.sh)" >> "$GITHUB_OUTPUT"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 0.x versions are feedback builds: mark them pre-release.
          case "$GITHUB_REF_NAME" in v0.*) pre=--prerelease ;; *) pre= ;; esac
          gh release create "$GITHUB_REF_NAME" "${{ steps.build.outputs.zip }}" \
            --title "${GITHUB_REF_NAME#v}" --generate-notes $pre
