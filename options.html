<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Vinted Seller Location Filter</title>
  <style>
    :root { color-scheme: light dark; }
    /* Used both as the toolbar popup and as the options page. */
    body { font: 14px/1.5 system-ui, sans-serif; margin: 0; padding: 14px 16px 16px; width: 300px; }
    header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
    header img { width: 28px; height: 28px; }
    header h1 { font-size: 16px; margin: 0; }
    form { display: grid; gap: 14px; }
    label { display: grid; gap: 4px; font-weight: 600; }
    label.check { display: flex; align-items: center; gap: 8px; font-weight: normal; }
    select { font: inherit; padding: 4px 6px; }
    .hint { font-weight: normal; font-size: 12px; opacity: 0.7; }
    #saved { font-size: 12px; opacity: 0; transition: opacity 0.2s; }
    #saved.show { opacity: 0.7; }
  </style>
</head>
<body>
  <header><img src="icons/icon48.png" alt=""><h1>Seller location</h1></header>
  <form>
    <label>My country
      <select id="country" disabled></select>
      <span class="hint">Listings from sellers in this country are kept. Everything else counts as "other".</span>
    </label>
    <label>Listings from other countries
      <select id="mode" disabled>
        <option value="badge">Show (badge only)</option>
        <option value="dim">Dim</option>
        <option value="hide">Hide</option>
      </select>
    </label>
    <label class="check"><input id="hideUnknown" type="checkbox" disabled> Also filter sellers whose country is unknown</label>
    <span id="saved">Saved</span>
  </form>
  <script src="shared.js"></script>
  <script src="options.js"></script>
</body>
</html>
